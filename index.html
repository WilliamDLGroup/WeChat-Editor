<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WeChat Editor</title>
  <script type="importmap">
    { "imports": { "marked": "https://cdn.jsdelivr.net/npm/marked@18.1.3/lib/marked.esm.js" } }
  </script>
  <style>
    :root { --bg: #f5f6f7; --panel: #fff; --line: #e3e5e8; --text: #1f2329; --muted: #6b7280; --accent: #07c160; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
    header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    header h1 { font-size: 16px; margin: 0 auto 0 0; }
    select, button, label { font-size: 14px; }
    button { padding: 6px 14px; border: 0; border-radius: 4px; background: var(--accent); color: #fff; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); height: calc(100vh - 53px); }
    textarea { width: 100%; height: 100%; border: 0; padding: 16px; resize: none; font: 14px/1.6 Menlo, Consolas, monospace; outline: none; }
    #preview-wrap { background: var(--panel); overflow: auto; }
    #preview { max-width: 677px; margin: 0 auto; padding: 20px 16px; }
    #status { font-size: 12px; color: var(--muted); }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; height: auto; min-height: calc(100vh - 53px); } }
  </style>
</head>
<body>
  <header>
    <h1>WeChat Editor</h1>
    <label>主题 <select id="theme"></select></label>
    <label><input type="checkbox" id="footnote" checked /> 外链转脚注</label>
    <span id="status"></span>
    <button id="copy">复制到公众号</button>
  </header>
  <main>
    <textarea id="src" spellcheck="false" aria-label="Markdown 输入"></textarea>
    <div id="preview-wrap"><article id="preview" aria-label="公众号预览"></article></div>
  </main>
  <script type="module">
    import { markdownToWechat } from './src/convert.js';
    import { themes, getTheme } from './src/themes.js';

    const $ = (id) => document.getElementById(id);
    const src = $('src'), preview = $('preview'), themeSel = $('theme'), footnote = $('footnote'), status = $('status');
    const SAMPLE = `# 用 Markdown 写公众号\n\n这是一段**正文**，包含 *强调* 和 \`行内代码\`。\n\n> 公众号会过滤 <style> 和 class，所以所有样式都要内联。\n\n## 列表\n\n- 外链会被转成脚注，比如 [Claude](https://claude.ai)\n- 站内链接保留，比如 [公众号文章](https://mp.weixin.qq.com/s/example)\n\n\`\`\`js\nconst html = markdownToWechat(md, { theme });\n\`\`\`\n\n| 功能 | 状态 |\n|---|---|\n| 内联样式 | ✅ |\n| 外链脚注 | ✅ |\n`;

    let saved = null;
    try { saved = localStorage.getItem('wechat-editor:md'); } catch {}
    src.value = saved ?? SAMPLE;
    for (const name of Object.keys(themes)) themeSel.add(new Option(name, name));

    function render() {
      const { html, links } = markdownToWechat(src.value, { theme: getTheme(themeSel.value), footnoteLinks: footnote.checked });
      preview.innerHTML = html;
      status.textContent = `${src.value.length} 字符 · ${links.length} 个外链`;
      try { localStorage.setItem('wechat-editor:md', src.value); } catch {}
    }

    // 以富文本写入剪贴板，粘贴进公众号编辑器后保留内联样式
    $('copy').addEventListener('click', async () => {
      const html = preview.innerHTML;
      try {
        await navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([html], { type: 'text/html' }),
          'text/plain': new Blob([preview.innerText], { type: 'text/plain' }),
        })]);
        status.textContent = '已复制，可直接粘贴到公众号编辑器';
      } catch {
        const range = document.createRange();
        range.selectNodeContents(preview);
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
        document.execCommand('copy'); sel.removeAllRanges();
        status.textContent = '已复制（兼容模式）';
      }
    });

    src.addEventListener('input', render);
    themeSel.addEventListener('change', render);
    footnote.addEventListener('change', render);
    render();
  </script>
</body>
</html>
